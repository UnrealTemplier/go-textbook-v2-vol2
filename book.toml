# book.toml — конфигурация Том 2. Базы данных: от SQL и моделирования до движков и HighLoad для html-textbook-engine.

[project]
version_file = "AGENTS.md"
version_pattern = '''^\s*[-*]?\s*\*\*Current project version:\*\*\s*`?([0-9A-Za-z.-]+)`?'''
storage_prefix = "go_textbook_v2_vol2_"

[content]
root = "sources"
index_file = "^0+\\. "
pages_beside_subdirs = true
wikilinks = true
canonical_replacements = [
  ["CI_CD", "CI/CD"],
  ["TCP_IP", "TCP/IP"],
  ["I_O", "I/O"],
  ["net_http_httptest", "net/http/httptest"],
  ["net_http_pprof", "net/http/pprof"],
  ["net_http", "net/http"],
  ["unicode_utf8", "unicode/utf8"],
  ["path_filepath", "path/filepath"],
  ["io_fs", "io/fs"],
  ["log_slog", "log/slog"],
  ["sync_atomic", "sync/atomic"],
  ["sync_pool", "sync.Pool"],
  ["sync_map", "sync.Map"],
  ["encoding_json", "encoding/json"],
  ["database_sql", "database/sql"],
  ["os_exec", "os/exec"],
]

[slug]
module = 35
section = 35
subsection = [20, 25]
page = 55
anchor = 80

[callouts]
interview_heuristic = true
alias = { critical = "note", solution = "tip", check = "info", practice = "tip" }

[navigation]
mode = "hybrid"
static_module_list = true

[navigation.reading_time]
method = "bytes"
divisor = 800
min = 2

[media]
enabled = true
dir_name = "media"
figures = true
lightbox = true
credits_page = "illustrations.html"
require_alt = true
require_credit = true
allowed_licenses = ["PD", "CC0", "CC BY", "CC BY-SA", "own"]
max_file_kb = 300
max_dimension_px = 1600
budget_mb = 100

[branding]
logo_icon_svg_file = "book/assets/logo-icon.svg"
logo_title_svg_file = "book/assets/logo-go.svg"
logo_title_text = " VOL.2"
logo_sub = "Учебник v2"
logo_aria_label = "На главную: Том 2 · Базы данных"
favicon_ico = "favicon.ico"
favicon_svg = "favicon.svg"

[article_page]
title_suffix_html = " | Том 2 · Базы данных"
meta_description_html = "{title} — Том 2. Базы данных: от SQL и моделирования до движков и HighLoad."
footer_html = [
  "Том 2. Базы данных: от SQL и моделирования до движков и HighLoad • Серия go-textbook-v2 (Go 1.22–1.24)",
  "Собрано автономным генератором html-textbook-engine. 100% Offline Ready.",
]

[index_page]
title_html = "Том 2. Базы данных: от SQL и моделирования до движков и HighLoad"
meta_description_html = "Фундаментальный учебник по базам данных для Go-разработчика: реляционная модель, SQL с нуля, индексы и EXPLAIN, транзакции и ACID, движки PostgreSQL и MySQL/InnoDB, репликация, шардирование и NoSQL."
hero_badge_html = "Том 2 из 7 · Go 1.22–1.24"
hero_title_html = "Базы данных: от первого SELECT до MVCC, шардирования и NoSQL"
quote_html = "<em>«Простота — необходимое условие надёжности».</em>"
quote_author_html = "— Эдсгер Дейкстра"
search_placeholder = "Поиск по {articles_grouped} урокам (например: SELECT, B-Tree, EXPLAIN, MVCC, WAL, Redis, ClickHouse)..."
stats = [
  { value = "{modules}", label = "Разделов" },
  { value = "{articles}", label = "Уроков" },
  { value = "{mermaid}", label = "Диаграмм Mermaid" },
  { value = "100%", label = "Offline &amp; file:///" },
]
catalog_title_html = "Содержание тома"
catalog_sub_html = "Строго линейный маршрут обучения: проходите разделы по порядку от начала до конца"
roadmap_title_html = "Карта всей серии go-textbook-v2 (7 линейных томов)"
roadmap_steps = [
  { badge = "Том 1", title_html = "Go и первый бэкенд", text_html = "Пролог Петцольда, Go с нуля, stdlib, базовая конкурентность, лёгкий CS/DSA и первый HTTP-сервис на JSON/файлах." },
  { badge = "Том 2", title_html = "Базы данных", text_html = "SQL с нуля, индексы и EXPLAIN, ACID/MVCC/WAL, PostgreSQL, MySQL/InnoDB, репликация, шардирование и NoSQL." },
  { badge = "Том 3", title_html = "Бэкенд, API, Архитектура и Брокеры", text_html = "REST/OpenAPI/gRPC, Testcontainers/CI, System Design, Clean/DDD, RabbitMQ, Kafka, NATS, Temporal, Outbox и Saga." },
  { badge = "Том 4", title_html = "Распределённые системы и Production", text_html = "CAP/PACELC, Raft/Paxos, отказоустойчивость, AppSec, Observability (Prometheus/OTel/slog), Linux, Nginx, Docker и Kubernetes." },
  { badge = "Том 5", title_html = "Под капотом и Производительность", text_html = "Компилятор Go, SSA, GMP, GC, новинки Go 1.25–1.27, глубокая архитектура CPU/Linux/сетей и профилирование pprof/trace." },
  { badge = "Том 6", title_html = "Алгоритмы и 247 задач LeetCode", text_html = "Полный курс структур данных и алгоритмов на Go плюс 247 разобранных и протестированных задач собеседований." },
  { badge = "Том 7", title_html = "Атлас собеседований (Junior → Staff)", text_html = "Компактные тематические карточки по грейдам для быстрого повторения перед техническими интервью." },
]
footer_html = [
  "Том 2. Базы данных: от SQL и моделирования до движков и HighLoad • Серия go-textbook-v2",
  "Полностью автономная сборка. Никаких трекеров, рекламы и внешних CDN.",
]

[markdown]
obsidian_lists = true
indented_fences = true

[math]
delimiters = [
  { left = "$$", right = "$$", display = true },
  { left = "$", right = "$", display = false },
  { left = '\(', right = '\)', display = false },
  { left = '\[', right = '\]', display = true },
]
protect = ['\(', '\[', "$$", "$"]
ignored_tags = ["script", "noscript", "style", "textarea", "pre", "code", "option"]
ignored_classes = ["code-block", "mermaid", "mermaid-wrapper"]
