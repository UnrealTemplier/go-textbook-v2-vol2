services:
  postgres:
    image: postgres:17-alpine
    container_name: ledgerpulse-postgres
    environment:
      POSTGRES_DB: ledgerpulse
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ./sql/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledgerpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: ledgerpulse-valkey
    ports:
      - "6379:6379"
    command: ["valkey-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: ledgerpulse-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./sql/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
